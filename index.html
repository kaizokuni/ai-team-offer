<style>
/* Layout: a menu of agents you tick on the left, a receipt that totals itself on the right (a bottom bar on phones). */
:root {
  --bg: #eef3f2; --surface: #ffffff; --ink: #10211f; --muted: #536965; --line: #d3dfdc;
  --accent: #0a7a62; --accent-ink: #ffffff; --accent-soft: #dcefe9; --chip: #f4f8f7;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1615; --surface: #13211f; --ink: #e3efec; --muted: #94aaa5; --line: #263936;
  --accent: #3ccaa6; --accent-ink: #06231c; --accent-soft: #123129; --chip: #182a27; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0c1615; --surface: #13211f; --ink: #e3efec; --muted: #94aaa5; --line: #263936;
  --accent: #3ccaa6; --accent-ink: #06231c; --accent-soft: #123129; --chip: #182a27; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 1rem/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 68rem; margin: 0 auto; padding-block: 2rem 7rem; display: grid; gap: 2.2rem; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.1rem, 5.5vw, 3.4rem); line-height: 1.04; font-weight: 800; letter-spacing: -0.02em; max-width: 16ch; }
h2 { font-size: 1.3rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font: 600 0.75rem/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }

.top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.lang button { font: 600 0.8rem/1 var(--body); letter-spacing: 0.05em; border: 0; background: none; color: var(--muted);
  padding: 0.5rem 0.85rem; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
header { display: grid; gap: 1rem; }
.lead { font-size: 1.15rem; color: var(--muted); max-width: 44rem; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 21rem; gap: 2rem; align-items: start; }
@media (max-width: 56rem) { .layout { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 2.2rem; min-width: 0; }
section { display: grid; gap: 0.9rem; }

/* agent menu */
.menu { display: grid; gap: 0.6rem; }
.item { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0.25rem 0.9rem; align-items: start;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; cursor: pointer;
  transition: border-color .15s, background .15s; }
.item:hover { border-color: var(--accent); }
.item input { position: absolute; opacity: 0; pointer-events: none; }
.box { grid-row: span 2; width: 1.4rem; height: 1.4rem; margin-top: 0.1rem; border-radius: 6px; border: 2px solid var(--line);
  display: grid; place-items: center; transition: background .15s, border-color .15s; }
.box svg { width: 0.9rem; height: 0.9rem; stroke: var(--accent-ink); stroke-width: 3; fill: none; opacity: 0; }
.item b { font: 600 1.05rem/1.3 var(--display); }
.item .price { font: 600 1.05rem/1.3 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.item .desc { grid-column: 2 / 4; color: var(--muted); font-size: 0.95rem; }
.item:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.item:has(input:checked) .box { background: var(--accent); border-color: var(--accent); }
.item:has(input:checked) .box svg { opacity: 1; }
.item:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.item.locked { cursor: default; }
.tag { font: 600 0.7rem/1 var(--body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent);
  border: 1px solid var(--accent); border-radius: 999px; padding: 0.25rem 0.5rem; margin-left: 0.4rem; vertical-align: 0.15em; white-space: nowrap; }
.extras { display: grid; gap: 0.6rem; }

/* included */
.included { background: var(--ink); color: var(--bg); border-radius: 14px; padding: 1.4rem 1.4rem 1.5rem; display: grid; gap: 1rem; }
.included h2 { color: var(--bg); }
.promises { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1rem 1.4rem; }
.promises div { display: grid; gap: 0.25rem; border-top: 2px solid var(--accent); padding-top: 0.7rem; }
.promises b { font: 600 1rem/1.3 var(--display); }
.promises p { opacity: 0.8; font-size: 0.95rem; }

/* tools */
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; min-width: 34rem; }
th, td { text-align: left; padding: 0.7rem 0.9rem; border-top: 1px solid var(--line); vertical-align: top; }
thead th { border-top: 0; font: 600 0.72rem/1.2 var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
td.p { text-align: right; white-space: nowrap; font: 500 0.92rem/1.5 var(--mono); font-variant-numeric: tabular-nums; }
td small { display: block; color: var(--muted); font: 400 0.82rem/1.4 var(--body); white-space: normal; }
td .need { font: 600 0.68rem/1 var(--body); letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); margin-left: 0.4rem; }
tr.off td { opacity: 0.45; }
.notes { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.4rem; color: var(--muted); }
.notes b { color: var(--ink); }

/* receipt */
.receipt { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 1rem); background: var(--surface); border: 1.5px solid var(--ink);
  border-radius: 14px; padding: 1.3rem; display: grid; gap: 1rem; }
.lines { display: grid; gap: 0.35rem; font-size: 0.95rem; }
.line { display: flex; justify-content: space-between; gap: 1rem; }
.line span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sum { border-top: 1.5px dashed var(--line); padding-top: 0.9rem; display: grid; gap: 0.2rem; }
.big { font: 800 2.4rem/1 var(--display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.month { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.95rem; }
.month span:last-child { font-family: var(--mono); white-space: nowrap; }
.copy { font: 600 0.95rem/1 var(--body); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
  padding: 0.85rem 1rem; cursor: pointer; }
.copy:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.copied { font-size: 0.85rem; color: var(--accent); min-height: 1.2em; }
#copytext { width: 100%; font: 0.85rem/1.4 var(--mono); border: 1px solid var(--line); border-radius: 8px; padding: 0.5rem; background: var(--chip); color: var(--ink); }
@media (max-width: 56rem) {
  .receipt { position: fixed; left: 0; right: 0; bottom: 0; top: auto; border-radius: 14px 14px 0 0; border-width: 1.5px 0 0;
    padding: 0.8rem max(16px, env(safe-area-inset-right, 0px)) calc(0.8rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0.3rem 1rem; z-index: 5; box-shadow: 0 -8px 24px rgb(0 0 0 / 0.08); }
  .receipt h2, .receipt .lines, .receipt .copied, .receipt #copytext { display: none; }
  .receipt .sum { border: 0; padding: 0; }
  .big { font-size: 1.8rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

    <span class="box">${CHECK}</span>
    <b>${esc(name)}${tag ? `<span class="tag">${esc(tag)}</span>` : ""}</b>
    <span class="price">${price}</span>
    <span class="desc">${esc(desc)}</span>
  </label>`;
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.set === lang)));
  document.getElementById("menu").innerHTML =
    item({ id: "base", name: t.baseName, desc: t.baseDesc, price: eur(BASE), checked: true, locked: true, tag: t.required }) +
    AGENTS.map((a) => item({ id: a.id, name: a[lang][0], desc: a[lang][1], price: eur(a.price), checked: picked.has(a.id) })).join("") +
    item({ id: "guide", name: t.guideName, desc: t.guideDesc, price: t.included, checked: true, locked: true });
  document.getElementById("extras").innerHTML =
    item({ id: "care", name: t.careName, desc: t.careDesc, price: `${eur(CARE)} ${t.perMonthShort}`, checked: care }) +
    item({ id: "custom", name: t.customName, desc: t.customDesc, price: `+${eur(CUSTOM)}`, checked: custom }) +
    item({ id: "win", name: t.winName, desc: t.winDesc, price: `+${eur(WINDOWS)}`, checked: win });
  document.getElementById("promises").innerHTML = t.promises.map(([b, p]) => `<div><b>${esc(b)}</b><p>${esc(p)}</p></div>`).join("");
  document.getElementById("notes").innerHTML = t.notes.map((n) => `<li>${n}</li>`).join("");
  update();
}

function update() {
  const t = T[lang];
  const chosen = AGENTS.filter((a) => picked.has(a.id));
  const total = BASE + chosen.reduce((s, a) => s + a.price, 0) + (win ? WINDOWS : 0) + (custom ? CUSTOM : 0);
  const needed = new Set(chosen.flatMap((a) => a.tools));
  let u = 0, e = 0;
  document.getElementById("tools").innerHTML = TOOLS.map((tool) => {
    const on = tool.always || needed.has(tool.id);
    if (on) { u += tool.usd || 0; e += tool.eur || 0; }
    const [name, use, note] = tool[lang];
    const price = tool.id === "meta" ? t.budget : tool.text ? t.current : tool.eur ? `${eur(tool.eur)} ${t.perMonthShort}` : tool.usd ? `${usd(tool.usd)} ${t.perMonthShort}` : t.free;
    const small = tool.id === "meta" ? t.budgetNote : note;
    return `<tr class="${on ? "" : "off"}"><td><b>${esc(name)}</b>${on && !tool.always ? `<span class="need">${t.need}</span>` : ""}</td>
      <td>${esc(use)}</td><td class="p">${esc(price)}${small ? `<small>${esc(small)}</small>` : ""}</td></tr>`;
  }).join("");
  const lines = [[t.baseName.split(":")[0], eur(BASE)], ...chosen.map((a) => [a[lang][0], eur(a.price)]), [t.guideName, t.included]];
  if (custom) lines.push([t.customName, `+${eur(CUSTOM)}`]);
  if (win) lines.push([t.winName, `+${eur(WINDOWS)}`]);
  document.getElementById("lines").innerHTML = lines.map(([a, b]) => `<div class="line"><span>${esc(a)}</span><span>${b}</span></div>`).join("");
  document.getElementById("total").textContent = eur(total);
  document.getElementById("monthly").textContent = care ? `${eur(CARE)} ${t.perMonthShort}` : t.none;
  document.getElementById("toolsum").textContent = `≈ ${usd(u)}${e ? ` + ${eur(e)}` : ""} ${t.perMonthShort}`;
  store.set("offer", JSON.stringify({ picked: [...picked], care, win, custom }));
}

function summary() {
  const t = T[lang];
  const names = [t.baseName.split(":")[0], ...AGENTS.filter((a) => picked.has(a.id)).map((a) => a[lang][0]), ...(custom ? [t.customName] : [])].join(", ");
  const total = BASE + AGENTS.filter((a) => picked.has(a.id)).reduce((s, a) => s + a.price, 0) + (win ? WINDOWS : 0) + (custom ? CUSTOM : 0);
  return t.summary(names, eur(total), care ? `${eur(CARE)} ${t.perMonthShort}` : t.none, win);
}

document.addEventListener("change", (ev) => {
  const id = ev.target.dataset && ev.target.dataset.id;
  if (!id) return;
  if (id === "care") care = ev.target.checked;
  else if (id === "win") win = ev.target.checked;
  else if (id === "custom") custom = ev.target.checked;
  else if (ev.target.checked) picked.add(id); else picked.delete(id);
  document.getElementById("copied").textContent = "";
  update();
});
document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => { lang = b.dataset.set; store.set("lang", lang); render(); }));
document.getElementById("copy").addEventListener("click", () => {
  const text = summary(), out = document.getElementById("copied"), box = document.getElementById("copytext");
  const fallback = () => { box.hidden = false; box.value = text; box.select(); out.textContent = T[lang].copiedFallback; };
  try {
    navigator.clipboard.writeText(text).then(() => { box.hidden = true; out.textContent = T[lang].copiedOk; }, fallback);
  } catch { fallback(); }
});

try {
  const saved = JSON.parse(store.get("offer") || "null");
  if (saved) { picked.clear(); saved.picked.forEach((id) => picked.add(id)); care = !!saved.care; win = !!saved.win; custom = !!saved.custom; }
} catch {}
lang = store.get("lang") || ((navigator.language || "").toLowerCase().startsWith("fr") ? "fr" : "en");
render();
</script>

</body>
</html>
